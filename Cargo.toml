[workspace]
resolver = "3"
members = ["libpandoc-sys", "libpandoc", "pandocrs"]
# its own: built for wasm32-wasip1 too, without libpandoc
exclude = ["filters"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# wasmtime's (the `wasm` feature); raised only when a dependency needs it;
# CI runs the tests on it
rust-version = "1.97"
license = "GPL-2.0-or-later"
repository = "https://github.com/ickc/libpandoc-rs"
authors = ["Kolen Cheung <christian.kolen@gmail.com>"]

[workspace.dependencies]
libpandoc-sys = { path = "libpandoc-sys", version = "0.1.0" }
libpandoc = { path = "libpandoc", version = "0.1.0" }
panir = { git = "https://github.com/ickc/panir" }
serde_json = "1"

# every `unsafe` says why it is sound (a `// SAFETY:` comment), and an
# unsafe fn's body marks its unsafe operations as any other
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# dependencies optimised in tests too: wasmtime compiles libpandoc.wasm
# (60 MB) in about 20 s optimised (32 threads), in minutes not (then cached)
[profile.dev.package."*"]
opt-level = 3
