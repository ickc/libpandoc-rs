# Example filters: ordinary pandoc JSON filters written with panir, which
# also build as wasm filters (WASI commands):
#
#     cargo build --release --target wasm32-wasip1
#     pandocrs -F target/wasm32-wasip1/release/upper.wasm input.md
#
# Not a member of the workspace (excluded there): it needs no libpandoc.
[package]
name = "libpandoc-example-filters"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
panir = { git = "https://github.com/ickc/panir" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

