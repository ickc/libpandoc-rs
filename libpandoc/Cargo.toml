[package]
name = "libpandoc"
description = "pandoc as a Rust library, in process: conversions, the typed AST (panir), filters in Rust"
keywords = ["pandoc", "markdown", "converter", "filter"]
categories = ["text-processing", "api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# run filters compiled to WebAssembly (WASI commands) in process, with
# wasmtime, and conversions in a directory sandbox ("sandbox": {"read":
# [...], "write": [...]}) in libpandoc.wasm, which libpandoc-sys finds (or
# downloads, with its `download` feature)
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "libpandoc-sys/wasm"]

[dependencies]
panir.workspace = true
serde_json.workspace = true

# built for wasm (a wasm filter), libpandoc is the host's (src/guest.rs);
# wasmtime's `gc` for libpandoc.wasm's exception handling (its Lua)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libpandoc-sys.workspace = true
wasmtime = { version = "50", optional = true, default-features = false, features = ["cranelift", "cache", "parallel-compilation", "runtime", "std", "gc", "gc-drc"] }
wasmtime-wasi = { version = "50", optional = true, default-features = false, features = ["p1"] }

[dev-dependencies]
# the example filters, for examples/bench.rs
libpandoc-example-filters = { path = "../filters" }

[[example]]
name = "bench"
required-features = ["wasm"]
