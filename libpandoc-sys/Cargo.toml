[package]
name = "libpandoc-sys"
description = "Raw bindings to libpandoc, pandoc as a C library"
links = "pandoc"
build = "build.rs"
keywords = ["pandoc", "ffi", "markdown"]
categories = ["external-ffi-bindings", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# when no installed libpandoc is found: download the release's build for
# this target into a data directory (build.rs)
download = ["dep:ureq", "dep:flate2", "dep:tar", "dep:sha2"]

[build-dependencies]
pkg-config = "0.3"
ureq = { version = "3", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
